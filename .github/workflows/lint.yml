name: "📋 Markdown Lint & Bilingual Symmetry Check"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Job 1: Markdown Lint
  # ===========================================================================
  markdown-lint:
    name: "Markdown Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify GitHub Actions are pinned to immutable SHAs
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          awk '
            {
              ref = $0
              sub(/^[[:space:]]*/, "", ref)
              sub(/^-[[:space:]]*/, "", ref)
              gsub(/["\047]/, "", ref)
              if (ref !~ /^uses[[:space:]]*:/) {
                next
              }
              sub(/^uses[[:space:]]*:[[:space:]]*/, "", ref)
              sub(/[[:space:]]+#.*$/, "", ref)
              if (ref ~ /^\.\//) {
                next
              }
              if (ref ~ /^docker:\/\//) {
                if (ref !~ /@sha256:[0-9a-f]+$/ || length(substr(ref, index(ref, "@sha256:") + 8)) != 64) {
                  print FILENAME ":" FNR ": mutable container action reference: " ref
                  invalid = 1
                }
                next
              }
              at = index(ref, "@")
              revision = substr(ref, at + 1)
              if (at == 0 || length(revision) != 40 || revision !~ /^[0-9a-f]+$/) {
                print FILENAME ":" FNR ": mutable action reference: " ref
                invalid = 1
              }
            }
            END { exit invalid ? 1 : 0 }
          ' "${workflow_files[@]}"

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            **/*.md
            !node_modules/**
            !.git/**

  # ===========================================================================
  # Job 2: ShellCheck
  # ===========================================================================
  shellcheck:
    name: "ShellCheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck if missing
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          shellcheck --severity=error init.sh axiarch-scripts/*.sh

      - name: Run Axiarch health gate
        run: bash axiarch-scripts/check-axiarch-health.sh --quiet

  # ===========================================================================
  # Job 3: Bilingual Symmetry Check
  # Ensures JA/EN relative file paths are always in sync
  # ===========================================================================
  bilingual-symmetry:
    name: "Bilingual Symmetry Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check exact JA/EN file-path symmetry
        run: |
          set -euo pipefail
          temp_dir=$(mktemp -d)
          trap 'rm -rf -- "$temp_dir"' EXIT

          check_pair() {
            label=$1
            ja_dir=$2
            en_dir=$3
            optional=${4:-false}

            if [ "$optional" = "true" ] && [ ! -d "$ja_dir" ] && [ ! -d "$en_dir" ]; then
              echo "ℹ️  ${label}: optional pair not found — skipping."
              return
            fi
            if [ ! -d "$ja_dir" ] || [ ! -d "$en_dir" ]; then
              echo "❌ FAIL: ${label} requires both ${ja_dir} and ${en_dir}."
              return 1
            fi

            ja_paths="${temp_dir}/$(echo "$label" | tr ' /' '__')-ja.txt"
            en_paths="${temp_dir}/$(echo "$label" | tr ' /' '__')-en.txt"
            find "$ja_dir" -type f -name "*.md" | sed "s#^${ja_dir}/##" | sort > "$ja_paths"
            find "$en_dir" -type f -name "*.md" | sed "s#^${en_dir}/##" | sort > "$en_paths"

            if ! diff -u "$ja_paths" "$en_paths"; then
              echo "❌ FAIL: ${label} relative file paths differ between JA and EN."
              return 1
            fi

            count=$(wc -l < "$ja_paths" | tr -d ' ')
            echo "✅ ${label}: ${count} exact relative paths in each language"
          }

          check_pair "Universal Rules" "axiarch-rules/ja/universal" "axiarch-rules/en/universal"
          check_pair "Blueprint" "axiarch-rules/ja/blueprint" "axiarch-rules/en/blueprint"
          check_pair "Execution Harness" "axiarch-harness/ja" "axiarch-harness/en"
          check_pair "Prompt Library" "axiarch-prompts/ja" "axiarch-prompts/en" "true"

      - name: Summary
        run: |
          echo ""
          echo "✅ All bilingual symmetry checks passed!"
          echo "   Axiarch maintains exact tracked JA/EN relative-path symmetry."
