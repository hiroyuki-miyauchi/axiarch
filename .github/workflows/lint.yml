name: "📋 Markdown Lint & Bilingual Symmetry Check"

on:
  workflow_call:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Job 1: Markdown Lint
  # ===========================================================================
  markdown-lint:
    name: "Markdown Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify GitHub Actions are pinned to immutable SHAs
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          awk '
            {
              ref = $0
              sub(/^[[:space:]]*/, "", ref)
              sub(/^-[[:space:]]*/, "", ref)
              gsub(/["\047]/, "", ref)
              if (ref !~ /^uses[[:space:]]*:/) {
                next
              }
              sub(/^uses[[:space:]]*:[[:space:]]*/, "", ref)
              sub(/[[:space:]]+#.*$/, "", ref)
              if (ref ~ /^\.\//) {
                next
              }
              if (ref ~ /^docker:\/\//) {
                if (ref !~ /@sha256:[0-9a-f]+$/ || length(substr(ref, index(ref, "@sha256:") + 8)) != 64) {
                  print FILENAME ":" FNR ": mutable container action reference: " ref
                  invalid = 1
                }
                next
              }
              at = index(ref, "@")
              revision = substr(ref, at + 1)
              if (at == 0 || length(revision) != 40 || revision !~ /^[0-9a-f]+$/) {
                print FILENAME ":" FNR ": mutable action reference: " ref
                invalid = 1
              }
            }
            END { exit invalid ? 1 : 0 }
          ' "${workflow_files[@]}"

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !node_modules/**
            !.git/**

  # ===========================================================================
  # Job 2: ShellCheck
  # ===========================================================================
  shellcheck:
    name: "ShellCheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck if missing
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          shellcheck --severity=error init.sh axiarch-scripts/*.sh

      - name: Run Axiarch health gate
        run: bash axiarch-scripts/check-axiarch-health.sh --quiet

  # ===========================================================================
  # Job 3: Bilingual Symmetry Check
  # Ensures JA/EN relative file paths are always in sync
  # ===========================================================================
  bilingual-symmetry:
    name: "Bilingual Symmetry Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check exact JA/EN file-path symmetry
        run: |
          set -euo pipefail
          temp_dir=$(mktemp -d)
          trap 'rm -rf -- "$temp_dir"' EXIT

          check_pair() {
            label=$1
            ja_dir=$2
            en_dir=$3
            optional=${4:-false}

            if [ "$optional" = "true" ] && [ ! -d "$ja_dir" ] && [ ! -d "$en_dir" ]; then
              echo "ℹ️  ${label}: optional pair not found — skipping."
              return
            fi
            if [ ! -d "$ja_dir" ] || [ ! -d "$en_dir" ]; then
              echo "❌ FAIL: ${label} requires both ${ja_dir} and ${en_dir}."
              return 1
            fi

            ja_paths="${temp_dir}/$(echo "$label" | tr ' /' '__')-ja.txt"
            en_paths="${temp_dir}/$(echo "$label" | tr ' /' '__')-en.txt"
            find "$ja_dir" -type f -name "*.md" | sed "s#^${ja_dir}/##" | sort > "$ja_paths"
            find "$en_dir" -type f -name "*.md" | sed "s#^${en_dir}/##" | sort > "$en_paths"

            if ! diff -u "$ja_paths" "$en_paths"; then
              echo "❌ FAIL: ${label} relative file paths differ between JA and EN."
              return 1
            fi

            count=$(wc -l < "$ja_paths" | tr -d ' ')
            echo "✅ ${label}: ${count} exact relative paths in each language"
          }

          check_pair "Universal Rules" "axiarch-rules/ja/universal" "axiarch-rules/en/universal"
          check_pair "Blueprint" "axiarch-rules/ja/blueprint" "axiarch-rules/en/blueprint"
          check_pair "Execution Harness" "axiarch-harness/ja" "axiarch-harness/en"
          check_pair "Prompt Library" "axiarch-prompts/ja" "axiarch-prompts/en" "true"

      - name: リリース説明と比較リンクの検査
        run: python3 tests/release_notes.py

      - name: Summary
        run: |
          echo ""
          echo "✅ All bilingual symmetry checks passed!"
          echo "   Axiarch maintains exact tracked JA/EN relative-path symmetry."

  runtime-regression:
    name: "隔離導入先での実動作回帰"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 実行対象コミットの確認
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: テスト環境の記録
        run: |
          git --version
          python3 --version
          python3 -c 'import platform; print(platform.platform())'
      - name: 実動作テスト
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  windows-compatibility:
    name: "Windows native診断とWSL 2実動作回帰"
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows nativeと改行の検証
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Unexpected checkout SHA' }
          python --version
          git --version
          python -c "import os,platform; assert os.name == 'nt'; print(platform.platform())"
          python -m unittest discover -s tests -p 'test_platform_boundaries.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: WSL 2 Ubuntuを準備
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: '2'
          use-cache: 'false'
          additional-packages: python3 git software-properties-common
          wsl-shell-user: axiarch-ci
      - name: WSLのGit診断機能を準備
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Ubuntu 24.04's original Git lacks --no-lazy-fetch. The Git project
          # documents this PPA for current Ubuntu packages; CI only, not adopters.
          wsl --distribution Ubuntu-24.04 --user root --exec bash -c 'set -euo pipefail; if ! git --no-lazy-fetch --version >/dev/null 2>&1; then add-apt-repository -y ppa:git-core/ppa; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y git; fi; git --no-lazy-fetch --version'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows上のWSL 2で同一コミットを検証
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          axiarch_ci_expected_sha='${{ github.sha }}'
          [[ "$axiarch_ci_expected_sha" =~ ^[0-9a-f]{40}$ ]]
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          uname -a
          python3 --version
          git --version
          python3 -c 'import os,platform; assert os.name == "posix"; assert os.getuid() != 0; assert "wsl2" in platform.release().lower(); print(platform.platform())'
          # Test on the Linux filesystem. Do not normalize away the Windows
          # checkout: the preceding native job already checks its LF bytes.
          axiarch_wsl_test_root=$(mktemp -d /tmp/axiarch-wsl-ci.XXXXXX)
          trap 'rm -rf -- "$axiarch_wsl_test_root"' EXIT
          git -c safe.directory="$PWD" -c core.autocrlf=false clone --no-hardlinks --no-checkout . "$axiarch_wsl_test_root/source"
          git -C "$axiarch_wsl_test_root/source" checkout --detach "$axiarch_ci_expected_sha"
          cd "$axiarch_wsl_test_root/source"
          test "$(git rev-parse HEAD)" = "$axiarch_ci_expected_sha"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash axiarch-scripts/check-axiarch-health.sh --quiet
